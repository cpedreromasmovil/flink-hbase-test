networks:
  flink-network:
    driver: bridge

services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    networks:
      - flink-network
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  hbase:
    image: blueskyareahm/hbase-base:2.1.3
    container_name: hbase
    command: master
    networks:
      - flink-network
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16201:16201"
      - "16301:16301"
    environment:
      - HBASE_ZOOKEEPER_QUORUM=zookeeper:2181
      - HBASE_MANAGES_ZK=false
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - ./init-script.hbase:/init-script.hbase
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16010"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  jobmanager:
    build:
      context: ./flinkbase
    container_name: jobmanager
    networks:
      - flink-network
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"
    depends_on:
      zookeeper:
        condition: service_healthy
      hbase:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  taskmanager:
    build:
      context: ./flinkbase  
    container_name: taskmanager
    networks:
      - flink-network
    command: taskmanager
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"
    depends_on:
      jobmanager:
        condition: service_healthy
    restart: unless-stopped